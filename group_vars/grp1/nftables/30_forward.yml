nftables_forward_rules:
  - source_network: 10.30.1.0/24
    destination_network: 10.30.2.0/24
  - source_network: 10.30.2.0/24
    destination_network: 10.30.1.0/24
  - from: lan
    to: wan
    source_network: lan
  - from: wan
    to: lan
    rules:
      - destination_group: public_web
        service: web
      - destination_group: mail_servers
        service: mail
  - from: wg0
    source_network: vpn
    rules:
      - to: lan
      - to: wan
        destination_network: mgmt
      - to: wan
        destination_network: 10.30.10.0/24
  - from: wan
    to: lan
    source_network: 10.30.10.0/24
    destination_network: lan
