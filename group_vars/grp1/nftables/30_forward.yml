nftables_forward_rules:
  - source_network: site_a
    destination_network: site_b
  - source_network: site_b
    destination_network: site_a
  - from: lan
    to: wan
    source_network: lan
  - from: wan
    to: lan
    rules:
      - destination_group: public_web
        service: web
      - destination_group: mail_servers
        service: mail
  - from: wg0
    source_network: vpn
    rules:
      - to: lan
      - to: wan
        destination_network: mgmt
      - to: wan
        destination_network: remote_site
  - from: wan
    to: lan
    source_network: remote_site
    destination_network: lan
