nftables_input_rules:
  - from: lan
    rules:
      - source_network: lan
        raw: ip protocol ospf
      - raw: ip protocol 112
      - service: wireguard
      - protocol: udp
        ports:
          - 3780
  - from: wan
    service: wireguard
  - from: wan
    source_network: mgmt
    rules:
      - raw: ip protocol ospf
      - service: ipsec
      - raw: ip protocol esp
