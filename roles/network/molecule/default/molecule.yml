---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: molecule-network
    image: jrei/systemd-debian:trixie
    privileged: true
    pre_build_image: true
    command: /sbin/init
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    env:
      container: docker
provisioner:
  name: ansible
  config_options:
    defaults:
      roles_path: ..
  inventory:
    hosts:
      all:
        hosts:
          molecule-network:
            ansible_become: false
            ansible_user: root
            ansible_python_interpreter: /usr/bin/python3
verifier:
  name: ansible
scenario:
  name: default
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
