---
- name: Validate nftables references
  ansible.builtin.assert:
    that:
      - item.service is not defined or item.service in nftables_services
      - item.destination_host is not defined or item.destination_host in nftables_hosts
      - item.dnat_to is not defined or item.dnat_to in nftables_hosts
      - item.source_group is not defined or item.source_group in nftables_host_groups
      - item.destination_group is not defined or item.destination_group in nftables_host_groups
      - item.source_network is not defined or '/' in item.source_network or item.source_network in nftables_networks
      - item.destination_network is not defined or '/' in item.destination_network or item.destination_network in nftables_networks
    fail_msg: "Rule references an undefined nftables object."
  loop: "{{ nftables_effective_rules }}"
  vars:
    nftables_effective_rules: >-
      {{ (nftables_input_rules | default([]) | nftables_expand('input', nftables_services))
         + (nftables_forward_rules | default([]) | nftables_expand('forward', nftables_services))
         + (nftables_nat_rules | default([]) | nftables_expand('nat', nftables_services))
         + (nftables_rules | default([]) | nftables_expand('generic', nftables_services)) }}
  loop_control:
    label: "{{ item | to_json }}"

- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present
    update_cache: true
  when: nftables_enabled

- name: Deploy nftables configuration
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: "{{ nftables_config.path | default('/etc/nftables.conf') }}"
    owner: root
    group: root
    mode: "0640"
    validate: "nft -c -f %s"
  when: nftables_enabled
  notify: Reload nftables

- name: Enable nftables
  ansible.builtin.systemd:
    name: "{{ nftables_config.service | default('nftables') }}"
    enabled: true
    state: started
  when: nftables_enabled

- name: Gather service facts
  ansible.builtin.service_facts:
  when: not nftables_enabled

- name: Disable nftables
  ansible.builtin.systemd:
    name: "{{ nftables_config.service | default('nftables') }}"
    enabled: false
    state: stopped
  when:
    - not nftables_enabled
    - (nftables_config.service | default('nftables')) ~ '.service' in ansible_facts.services
