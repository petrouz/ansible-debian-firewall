---
- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present
    update_cache: true

- name: Deploy nftables configuration
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: "{{ nftables_config.path | default('/etc/nftables.conf') }}"
    owner: root
    group: root
    mode: "0640"
    validate: "nft -c -f %s"
  notify: Reload nftables

- name: Enable nftables
  ansible.builtin.service:
    name: "{{ nftables_config.service | default('nftables') }}"
    enabled: true
    state: started

- name: Ensure nftables is started and enabled
  ansible.builtin.systemd:
    name: nftables
    state: started
    enabled: true
  when: nftables_enabled
