---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    wireguard_enabled: true
    wireguard_manage_service: false
    wireguard_interfaces:
      - name: wg0
        address: 10.100.0.1/30
  tasks:
    - name: Include wireguard role
      ansible.builtin.include_role:
        name: wireguard
