---
- name: Deploy provided private keys
  ansible.builtin.copy:
    content: "{{ wg_interface.private_key }}\n"
    dest: "{{ wireguard_key_directory }}/{{ wg_interface.name }}.key"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ wireguard_interfaces }}"
  loop_control:
    loop_var: wg_interface
  when:
    - wg_interface.private_key is defined
    - wg_interface.private_key | length > 0

- name: Generate shared private keys on primary
  ansible.builtin.shell:
    cmd: "wg genkey > {{ wireguard_key_directory }}/{{ wg_interface.name }}.key"
    creates: "{{ wireguard_key_directory }}/{{ wg_interface.name }}.key"
  loop: "{{ wireguard_interfaces }}"
  loop_control:
    loop_var: wg_interface
  when:
    - wg_interface.private_key is not defined or wg_interface.private_key | length == 0
    - keepalived_enabled | default(false)
    - inventory_hostname == wireguard_ha_primary

- name: Fetch shared private keys from primary
  ansible.builtin.slurp:
    src: "{{ wireguard_key_directory }}/{{ wg_interface.name }}.key"
  register: wireguard_primary_keys
  loop: "{{ wireguard_interfaces }}"
  loop_control:
    loop_var: wg_interface
  when:
    - wg_interface.private_key is not defined or wg_interface.private_key | length == 0
    - keepalived_enabled | default(false)
    - inventory_hostname != wireguard_ha_primary
  delegate_to: "{{ wireguard_ha_primary }}"

- name: Deploy shared private keys on secondary
  ansible.builtin.copy:
    content: "{{ key_result.content | b64decode }}\n"
    dest: "{{ wireguard_key_directory }}/{{ key_result.wg_interface.name }}.key"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ wireguard_primary_keys.results | default([]) }}"
  loop_control:
    loop_var: key_result
  when:
    - inventory_hostname != wireguard_ha_primary
    - keepalived_enabled | default(false)

- name: Generate private keys locally
  ansible.builtin.shell:
    cmd: "wg genkey > {{ wireguard_key_directory }}/{{ wg_interface.name }}.key"
    creates: "{{ wireguard_key_directory }}/{{ wg_interface.name }}.key"
  loop: "{{ wireguard_interfaces }}"
  loop_control:
    loop_var: wg_interface
  when:
    - wg_interface.private_key is not defined or wg_interface.private_key | length == 0
    - not keepalived_enabled | default(false)

- name: Compute public keys
  ansible.builtin.shell:
    cmd: "wg pubkey < {{ wireguard_key_directory }}/{{ wg_interface.name }}.key"
  loop: "{{ wireguard_interfaces }}"
  loop_control:
    loop_var: wg_interface
  register: wireguard_public_keys
  changed_when: false

- name: Deploy public keys
  ansible.builtin.copy:
    content: "{{ public_key.stdout }}\n"
    dest: "{{ wireguard_key_directory }}/{{ public_key.wg_interface.name }}.pub"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ wireguard_public_keys.results }}"
  loop_control:
    loop_var: public_key

- name: Read private keys for tunnel configuration
  ansible.builtin.slurp:
    src: "{{ wireguard_key_directory }}/{{ wg_interface.name }}.key"
  loop: "{{ wireguard_interfaces }}"
  loop_control:
    loop_var: wg_interface
  register: wireguard_key_contents
