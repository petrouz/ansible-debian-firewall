---
- name: Configure strongSwan
  block:
    - name: Install strongSwan
      ansible.builtin.apt:
        name: "{{ strongswan_packages }}"
        state: present
        update_cache: true

    - name: Deploy strongSwan secrets
      ansible.builtin.template:
        src: ipsec.secrets.j2
        dest: /etc/ipsec.secrets
        owner: root
        group: root
        mode: "0600"
      when: strongswan_connections | length > 0
      notify: Restart strongSwan

    - name: Deploy strongSwan configuration
      ansible.builtin.template:
        src: ipsec.conf.j2
        dest: /etc/ipsec.conf
        owner: root
        group: root
        mode: "0600"
      when: strongswan_connections | length > 0
      notify: Restart strongSwan

- name: Enable and start strongSwan (standalone)
  ansible.builtin.systemd:
    name: strongswan-starter
    state: started
    enabled: true
  when:
    - strongswan_enabled
    - not keepalived_enabled | default(false)

- name: Disable strongSwan autostart in HA
  ansible.builtin.systemd:
    name: strongswan-starter
    enabled: false
  when:
    - strongswan_enabled
    - keepalived_enabled | default(false)
